# utm-dev-cli — Rust binary for orchestrating UTM VMs (cross-platform Tauri builds).
#
# Adopts joeblew999/.github mise-tasks v0.10.0 (full nu library) — gets
# rust:build / rust:test / rust:wasm-pack / secrets:* / fnox:init for free.
# Local tasks add only what's specific to this binary (run, install).

[task_config]
includes = ["git::https://github.com/joeblew999/.github.git//mise-tasks?ref=v0.19.1"]

[tools]
rust                     = "nightly"
"github:nushell/nushell" = "0.112"  # required by .github v0.10.0+ (all shared mise-tasks are nu)
"github:jdx/fnox"        = "1.23"   # for secrets:* + bw:* shared tasks
"aqua:cli/cli"           = "2"      # gh CLI; needed by secrets:sync-github
"aqua:jqlang/jq"         = "1"      # used by some shared bash steps
"cargo:usage-cli"        = "3"      # tab-completion for #USAGE-spec tasks

# Shared rust:build / rust:test / rust:wasm-pack are now nu — they shell
# out to cargo, same as the bash equivalents did. Local tasks below add
# what's not in shared.

[tasks.run]
description = "run the binary (forwards remaining args to utm-dev)"
run = "cargo run -- {{arg(name='args', var=true, help='arguments to pass to utm-dev')}}"

[tasks.install]
description = "install utm-dev binary to ~/.cargo/bin"
run = "cargo install --path ."

# ── code quality ──────────────────────────────────────────────────────────────
# Local-only checks: no VM, no network. Wired into e2e:smoke as the first gate
# so style/lint regressions fail fast before the slower VM-touching tasks run.

[tasks."rust:fmt"]
description = "cargo fmt — apply formatting"
run = "cargo fmt --all"

[tasks."rust:fmt-check"]
description = "cargo fmt --check — fail if formatting drift"
run = "cargo fmt --all -- --check"

[tasks."rust:clippy"]
description = "cargo clippy --all-targets — fail on any warning"
run = "cargo clippy --all-targets --no-deps -- -D warnings"

[tasks."rust:quality"]
description = "fmt-check + clippy — full local quality gate (no VM, no network)"
depends = ["rust:fmt-check", "rust:clippy"]

# ── e2e smoke tests ───────────────────────────────────────────────────────────
# Two layers:
#   e2e:fast  — host-only (~25s). Run on every save.
#   e2e:smoke — adds the 3 VM-touching tasks (~140s). Run before push.
#
# Both gate on rust:quality first so style/lint failures abort in <1s.
# All e2e tasks depend on _e2e:build so cargo compiles once, not per task.

[tasks."_e2e:build"]
hide = true
description = "build utm-dev once for the e2e tasks to share"
run = "cargo build --release"

[tasks."e2e:doctor"]
description = "smoke: vm doctor on windows-build (ssh subprocess + doctor module)"
shell = "nu -c"
depends = ["_e2e:build"]
run = "^./target/release/utm-dev vm doctor --name windows-build"

[tasks."e2e:clean-dry"]
description = "smoke: vm clean --dry-run (ssh subprocess + clean module + UTF-8-lossy)"
shell = "nu -c"
depends = ["_e2e:build"]
run = "^./target/release/utm-dev vm clean --name windows-build --dry-run"

[tasks."e2e:mac"]
description = "smoke: native mac build + run (mise.toml respect + ProjectKind=Cargo + cargo wiring)"
shell = "nu -c"
depends = ["_e2e:build"]
run = """
^./target/release/utm-dev mac build --release
^./.build/macos/arm64/utm-dev --version
print "✓ mac build+run"
"""

[tasks."e2e:demo-mac"]
description = "smoke: Tauri path via utm-dev-demo (ProjectKind=Tauri). Skips if not cloned as ../utm-dev-demo (override with UTM_DEV_DEMO_PATH)."
shell = "nu -c"
depends = ["_e2e:build"]
run = """
let demo = ($env.UTM_DEV_DEMO_PATH? | default "../utm-dev-demo")
if not ($demo | path exists) {
  print $"  (skip) ($demo) not present — clone https://github.com/joeblew999/utm-dev-demo or set UTM_DEV_DEMO_PATH"
  return
}
let utm_dev = (pwd | path join "target/release/utm-dev")
# Trust the demo's mise.toml so `utm-dev mac build`'s internal `mise install`
# doesn't bail on untrusted-config errors. Idempotent — no-op if already trusted.
^mise trust $demo
cd $demo
^$utm_dev mac build --release
print "✓ tauri mac build via utm-dev"
"""

[tasks."e2e:windows-run"]
description = "smoke: dogfood `utm-dev vm push` + `vm exec` to put the cross-built .exe on the windows-build VM and run it. Skips if no .exe at .build/windows/x86_64/."
shell = "nu -c"
depends = ["_e2e:build"]
run = '''
let exe = ".build/windows/x86_64/utm-dev.exe"
if not ($exe | path exists) {
  print $"  (skip) ($exe) not present — run `utm-dev windows build --release` first"
  return
}
let utm_dev = "./target/release/utm-dev"
^$utm_dev vm push --name windows-build --from $exe --to "C:\\Users\\vagrant\\utm-dev.exe"
let out = (^$utm_dev vm exec --name windows-build "C:\\Users\\vagrant\\utm-dev.exe --version" | str trim)
print $"  windows VM ran utm-dev.exe and said: ($out)"
if not ($out | str starts-with "utm-dev") {
  print "  ✗ unexpected output"
  exit 1
}
print "✓ utm-dev push + exec round-trip on the windows-build VM"
'''

[tasks."e2e:vm-run"]
description = "smoke: exercise `utm-dev vm run -- --version` + `vm logs` end-to-end. Pushes utm-dev.exe to the VM (via e2e:windows-run), launches it under `vm run` with --version, then asserts run.log contains the version line. Cleaner assertion than no-arg help-on-stderr."
shell = "nu -c"
depends = ["_e2e:build"]
run = '''
let exe = ".build/windows/x86_64/utm-dev.exe"
if not ($exe | path exists) {
  print $"  (skip) ($exe) not present — run `utm-dev windows build --release` first"
  return
}
let utm_dev = "./target/release/utm-dev"
# Pass `--version` to the binary so it writes a deterministic line ("utm-dev 0.1.0")
# to stdout. Without args utm-dev prints help to stderr (clap default), which
# also works but is harder to assert against.
^$utm_dev vm run --name windows-build --bin "C:\\Users\\vagrant\\utm-dev.exe" -- --version
sleep 3sec
let log = (^$utm_dev vm logs --name windows-build --kind run --tail 50 | decode utf-8 | str trim)
if not ($log | str contains "utm-dev 0.1") {
  print "  ✗ vm run --version did not surface a recognizable version line"
  print $log
  exit 1
}
print "✓ utm-dev vm run + vm logs round-trip on the windows-build VM"
'''

[tasks."e2e:validate"]
description = "smoke: pixel-diff self-comparison (golden = actual) → 100% match. Sanity test for the `utm-dev validate` command. No VM, no network."
shell = "nu -c"
depends = ["_e2e:build"]
run = '''
let out = (^./target/release/utm-dev validate --actual tests/fixtures/checker.png --golden tests/fixtures/checker.png | str trim)
if not ($out | str contains "100.00%") {
  print $"  ✗ self-comparison didn't match 100%: ($out)"
  exit 1
}
print "✓ utm-dev validate self-comparison = 100%"
'''

[tasks."e2e:tauri-demo-windows"]
description = "smoke: end-to-end Tauri demo on Windows VM — push pre-built MSI, install silently, vm run --interactive, vm screenshot, validate against golden. Skips if no MSI built (run `cd ../utm-dev-demo && utm-dev windows build --release` first). Visual proof that Tauri release apps render correctly on the windows-build VM."
shell = "nu -c"
depends = ["_e2e:build"]
run = '''
let demo = ($env.UTM_DEV_DEMO_PATH? | default "../utm-dev-demo")
let msi = $"($demo)/.build/windows/x86_64/msi/utm-dev-demo_0.1.0_x64_en-US.msi"
if not ($msi | path exists) {
  print $"  (skip) ($msi) not present — run `cd ($demo) && utm-dev windows build --release` first"
  return
}
let utm_dev = "./target/release/utm-dev"
let golden = "tests/golden/utm-dev-demo-windows.png"
let actual = "screenshots/utm-dev-demo-windows-e2e.png"
let diff = "screenshots/utm-dev-demo-windows-e2e.diff.png"

print "→ pushing MSI to VM..."
^$utm_dev vm push --name windows-build --from $msi --to "C:\\Users\\vagrant\\demo.msi"

print "→ installing MSI silently (idempotent)..."
^$utm_dev vm exec --name windows-build "msiexec /i C:\\Users\\vagrant\\demo.msi /qn /norestart"

print "→ launching utm-dev-demo via vm run --interactive..."
^$utm_dev vm run --name windows-build --interactive --bin "C:\\Program Files\\utm-dev-demo\\utm-dev-demo.exe"

print "→ waiting 4s for WebView2 to render..."
sleep 4sec

print "→ capturing desktop..."
^$utm_dev vm screenshot --name windows-build --out $actual

print "→ pixel-diff vs golden..."
let result = (^$utm_dev validate --actual $actual --golden $golden --tolerance 90 --diff $diff | str trim)
print $result
if not ($result | str contains "100.00%") and not ($result | str contains "match: 9") {
  print "  ✗ validation failed"
  exit 1
}
print "✓ Tauri demo running on Windows — verified by pixel-diff"
'''

[tasks."e2e:fast"]
description = "host-only smoke (~25s) — quality + validate + mac + demo-mac. No VM, no network. Run on every save."
depends = ["rust:quality", "e2e:validate", "e2e:mac", "e2e:demo-mac"]

[tasks."e2e:smoke"]
description = "pre-push smoke (~70s) — quality + validate + all VM tasks EXCEPT e2e:clean-dry (which scans the WU cache and takes 140s solo). Includes e2e:tauri-demo-windows for visual proof that Tauri release apps actually render. Run e2e:clean-dry by hand or use e2e:smoke-full when working on vm clean."
depends = ["rust:quality", "e2e:validate", "e2e:doctor", "e2e:mac", "e2e:demo-mac", "e2e:windows-run", "e2e:vm-run", "e2e:tauri-demo-windows"]

[tasks."e2e:smoke-full"]
description = "the kitchen sink (~190s) — e2e:smoke + e2e:clean-dry. Use when you've touched src/cmd/vm/clean.rs or the scripts/clean/ payload. Otherwise use e2e:smoke."
depends = ["e2e:smoke", "e2e:clean-dry"]
