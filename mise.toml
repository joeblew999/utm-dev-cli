[tools]
rust = "nightly"
"cargo:usage-cli" = "3"

[tasks.build]
description = "cargo build"
run = "cargo build"

[tasks.test]
description = "cargo test"
run = "cargo test"

[tasks.run]
description = "run the binary"
run = "cargo run -- {{arg(name='args', var=true, help='arguments to pass to utm-dev')}}"

[tasks.install]
description = "install utm-dev binary to ~/.cargo/bin"
run = "cargo install --path ."
