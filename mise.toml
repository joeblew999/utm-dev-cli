# utm-dev-cli — Rust binary for orchestrating UTM VMs (cross-platform Tauri builds).
#
# Adopts joeblew999/.github mise-tasks v0.10.0 (full nu library) — gets
# rust:build / rust:test / rust:wasm-pack / secrets:* / fnox:init for free.
# Local tasks add only what's specific to this binary (run, install).

[task_config]
includes = ["git::https://github.com/joeblew999/.github.git//mise-tasks?ref=v0.10.0"]

[tools]
rust                     = "nightly"
"github:nushell/nushell" = "0.112"  # required by .github v0.10.0+ (all shared mise-tasks are nu)
"github:jdx/fnox"        = "1.23"   # for secrets:* + bw:* shared tasks
"aqua:cli/cli"           = "2"      # gh CLI; needed by secrets:sync-github
"aqua:jqlang/jq"         = "1"      # used by some shared bash steps
"cargo:usage-cli"        = "3"      # tab-completion for #USAGE-spec tasks

# Shared rust:build / rust:test / rust:wasm-pack are now nu — they shell
# out to cargo, same as the bash equivalents did. Local tasks below add
# what's not in shared.

[tasks.run]
description = "run the binary (forwards remaining args to utm-dev)"
run = "cargo run -- {{arg(name='args', var=true, help='arguments to pass to utm-dev')}}"

[tasks.install]
description = "install utm-dev binary to ~/.cargo/bin"
run = "cargo install --path ."

# ── code quality ──────────────────────────────────────────────────────────────
# Local-only checks: no VM, no network. Wired into e2e:smoke as the first gate
# so style/lint regressions fail fast before the slower VM-touching tasks run.

[tasks."rust:fmt"]
description = "cargo fmt — apply formatting"
run = "cargo fmt --all"

[tasks."rust:fmt-check"]
description = "cargo fmt --check — fail if formatting drift"
run = "cargo fmt --all -- --check"

[tasks."rust:clippy"]
description = "cargo clippy --all-targets — fail on any warning"
run = "cargo clippy --all-targets --no-deps -- -D warnings"

[tasks."rust:quality"]
description = "fmt-check + clippy — full local quality gate (no VM, no network)"
depends = ["rust:fmt-check", "rust:clippy"]

# ── e2e smoke tests ───────────────────────────────────────────────────────────
# Two layers:
#   e2e:fast  — host-only (~25s). Run on every save.
#   e2e:smoke — adds the 3 VM-touching tasks (~140s). Run before push.
#
# Both gate on rust:quality first so style/lint failures abort in <1s.
# All e2e tasks depend on _e2e:build so cargo compiles once, not per task.

[tasks."_e2e:build"]
hide = true
description = "build utm-dev once for the e2e tasks to share"
run = "cargo build --release"

[tasks."e2e:doctor"]
description = "smoke: vm doctor on windows-build (ssh subprocess + doctor module)"
shell = "nu -c"
depends = ["_e2e:build"]
run = "^./target/release/utm-dev vm doctor --name windows-build"

[tasks."e2e:clean-dry"]
description = "smoke: vm clean --dry-run (ssh subprocess + clean module + UTF-8-lossy)"
shell = "nu -c"
depends = ["_e2e:build"]
run = "^./target/release/utm-dev vm clean --name windows-build --dry-run"

[tasks."e2e:mac"]
description = "smoke: native mac build + run (mise.toml respect + ProjectKind=Cargo + cargo wiring)"
shell = "nu -c"
depends = ["_e2e:build"]
run = """
^./target/release/utm-dev mac build --release
^./.build/macos/arm64/utm-dev --version
print "✓ mac build+run"
"""

[tasks."e2e:demo-mac"]
description = "smoke: Tauri path via utm-dev-demo (ProjectKind=Tauri). Skips if not cloned as ../utm-dev-demo (override with UTM_DEV_DEMO_PATH)."
shell = "nu -c"
depends = ["_e2e:build"]
run = """
let demo = ($env.UTM_DEV_DEMO_PATH? | default "../utm-dev-demo")
if not ($demo | path exists) {
  print $"  (skip) ($demo) not present — clone https://github.com/joeblew999/utm-dev-demo or set UTM_DEV_DEMO_PATH"
  return
}
let utm_dev = (pwd | path join "target/release/utm-dev")
# Trust the demo's mise.toml so `utm-dev mac build`'s internal `mise install`
# doesn't bail on untrusted-config errors. Idempotent — no-op if already trusted.
^mise trust $demo
cd $demo
^$utm_dev mac build --release
print "✓ tauri mac build via utm-dev"
"""

[tasks."e2e:windows-run"]
description = "smoke: dogfood `utm-dev vm push` + `vm exec` to put the cross-built .exe on the windows-build VM and run it. Skips if no .exe at .build/windows/x86_64/."
shell = "nu -c"
depends = ["_e2e:build"]
run = '''
let exe = ".build/windows/x86_64/utm-dev.exe"
if not ($exe | path exists) {
  print $"  (skip) ($exe) not present — run `utm-dev windows build --release` first"
  return
}
let utm_dev = "./target/release/utm-dev"
^$utm_dev vm push --name windows-build --from $exe --to "C:\\Users\\vagrant\\utm-dev.exe"
let out = (^$utm_dev vm exec --name windows-build "C:\\Users\\vagrant\\utm-dev.exe --version" | str trim)
print $"  windows VM ran utm-dev.exe and said: ($out)"
if not ($out | str starts-with "utm-dev") {
  print "  ✗ unexpected output"
  exit 1
}
print "✓ utm-dev push + exec round-trip on the windows-build VM"
'''

[tasks."e2e:vm-run"]
description = "smoke: exercise `utm-dev vm run` + `vm logs` end-to-end against the windows-build VM. Pushes utm-dev.exe (assumed already there from e2e:windows-run), launches it via vm run, then asserts the captured run.log contains the binary's startup output."
shell = "nu -c"
depends = ["_e2e:build"]
run = '''
let exe = ".build/windows/x86_64/utm-dev.exe"
if not ($exe | path exists) {
  print $"  (skip) ($exe) not present — run `utm-dev windows build --release` first"
  return
}
let utm_dev = "./target/release/utm-dev"
# vm run launches the binary detached; without args it prints help to stdout
# which Start-Process redirects into ~/.utm-dev-run/run.log on the VM.
^$utm_dev vm run --name windows-build --bin "C:\\Users\\vagrant\\utm-dev.exe"
sleep 3sec
let log = (^$utm_dev vm logs --name windows-build --kind run --tail 50 | decode utf-8 | str trim)
if not ($log | str contains "utm-dev") {
  print "  ✗ vm run captured no recognizable output"
  print $log
  exit 1
}
print "✓ utm-dev vm run + vm logs round-trip on the windows-build VM"
'''

[tasks."e2e:fast"]
description = "host-only smoke (~25s) — quality + mac + demo-mac. No VM, no network. Run on every save."
depends = ["rust:quality", "e2e:mac", "e2e:demo-mac"]

[tasks."e2e:smoke"]
description = "pre-push smoke (~50s) — quality + all VM tasks EXCEPT e2e:clean-dry (which scans the WU cache and takes 140s solo). Run e2e:clean-dry by hand or use e2e:smoke-full when working on vm clean."
depends = ["rust:quality", "e2e:doctor", "e2e:mac", "e2e:demo-mac", "e2e:windows-run", "e2e:vm-run"]

[tasks."e2e:smoke-full"]
description = "the kitchen sink (~190s) — e2e:smoke + e2e:clean-dry. Use when you've touched src/cmd/vm/clean.rs or the scripts/clean/ payload. Otherwise use e2e:smoke."
depends = ["e2e:smoke", "e2e:clean-dry"]
