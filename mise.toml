# utm-dev-cli — Rust binary for orchestrating UTM VMs (cross-platform Tauri builds).
#
# Adopts joeblew999/.github mise-tasks v0.10.0 (full nu library) — gets
# rust:build / rust:test / rust:wasm-pack / secrets:* / fnox:init for free.
# Local tasks add only what's specific to this binary (run, install).

[task_config]
includes = ["git::https://github.com/joeblew999/.github.git//mise-tasks?ref=v0.10.0"]

[tools]
rust                     = "nightly"
"github:nushell/nushell" = "0.112"  # required by .github v0.10.0+ (all shared mise-tasks are nu)
"github:jdx/fnox"        = "1.23"   # for secrets:* + bw:* shared tasks
"aqua:cli/cli"           = "2"      # gh CLI; needed by secrets:sync-github
"aqua:jqlang/jq"         = "1"      # used by some shared bash steps
"cargo:usage-cli"        = "3"      # tab-completion for #USAGE-spec tasks

# Shared rust:build / rust:test / rust:wasm-pack are now nu — they shell
# out to cargo, same as the bash equivalents did. Local tasks below add
# what's not in shared.

[tasks.run]
description = "run the binary (forwards remaining args to utm-dev)"
run = "cargo run -- {{arg(name='args', var=true, help='arguments to pass to utm-dev')}}"

[tasks.install]
description = "install utm-dev binary to ~/.cargo/bin"
run = "cargo install --path ."

# ── e2e smoke tests ───────────────────────────────────────────────────────────
# Fast regression check — exercises the paths we've actually rewritten:
# ssh CLI subprocess, vm clean module, vm doctor module, mac native build,
# mise.toml respect, ProjectKind detection. Skips the 18-min cross-compile
# (manual dogfood for that). Total: ~30 sec when host binary is up to date.
#
# Run all:    mise run e2e:smoke
# Run one:    mise run e2e:doctor   (or e2e:clean-dry, e2e:mac)

[tasks."e2e:doctor"]
description = "smoke: vm doctor on windows-build (ssh subprocess + doctor module)"
shell = "nu -c"
run = "cargo run --release -- vm doctor --name windows-build"

[tasks."e2e:clean-dry"]
description = "smoke: vm clean --dry-run (ssh subprocess + clean module + UTF-8-lossy)"
shell = "nu -c"
run = "cargo run --release -- vm clean --name windows-build --dry-run"

[tasks."e2e:mac"]
description = "smoke: native mac build + run (mise.toml respect + ProjectKind=Cargo + cargo wiring)"
shell = "nu -c"
run = """
cargo run --release -- mac build --release
^./.build/macos/arm64/utm-dev --version
print "✓ mac build+run"
"""

[tasks."e2e:demo-mac"]
description = "smoke: Tauri path via utm-dev-demo (ProjectKind=Tauri). Skips if not cloned as ../utm-dev-demo (override with UTM_DEV_DEMO_PATH)."
shell = "nu -c"
run = """
let demo = ($env.UTM_DEV_DEMO_PATH? | default "../utm-dev-demo")
if not ($demo | path exists) {
  print $"  (skip) ($demo) not present — clone https://github.com/joeblew999/utm-dev-demo or set UTM_DEV_DEMO_PATH"
  return
}
cargo build --release
let utm_dev = (pwd | path join "target/release/utm-dev")
# Trust the demo's mise.toml so `utm-dev mac build`'s internal `mise install`
# doesn't bail on untrusted-config errors. Idempotent — no-op if already trusted.
^mise trust $demo
cd $demo
^$utm_dev mac build --release
print "✓ tauri mac build via utm-dev"
"""

[tasks."e2e:windows-run"]
description = "smoke: copy the already-built .exe back to windows-build VM, run it, verify --version output. Skips if no .exe at .build/windows/x86_64/."
shell = "nu -c"
run = '''
let exe = ".build/windows/x86_64/utm-dev.exe"
if not ($exe | path exists) {
  print $"  (skip) ($exe) not present — run `utm-dev windows build --release` first"
  return
}
let ssh_opts = ["-p", "2222", "-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=/dev/null", "-o", "LogLevel=ERROR", "-o", "BatchMode=yes"]
^scp -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o BatchMode=yes $exe 'vagrant@localhost:utm-dev.exe'
let out = (^ssh ...$ssh_opts vagrant@localhost 'C:\Users\vagrant\utm-dev.exe --version' | str trim)
print $"  windows VM ran utm-dev.exe and said: ($out)"
if not ($out | str starts-with "utm-dev") {
  print "  ✗ unexpected output"
  exit 1
}
print "✓ windows .exe runs on the windows-build VM"
'''

[tasks."e2e:smoke"]
description = "all e2e smoke tests — pre-push regression check (~30 sec when warm; demo-mac skips if not cloned, windows-run skips if no .exe built)"
depends = ["e2e:doctor", "e2e:clean-dry", "e2e:mac", "e2e:demo-mac", "e2e:windows-run"]
